name: CI Windows

on:
  push:
    branches: [main]
    tags:
      - 'windows-v*'
    paths:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            mpv: x86_64
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            mpv: aarch64
    defaults:
      run:
        shell: pwsh
        working-directory: desktop

    steps:
      - uses: actions/checkout@v5

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('desktop/Cargo.lock') }}

      - name: Tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Compilation release
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: libmpv (builds publiques mpv-winbuild-cmake)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = gh release view --repo shinchiro/mpv-winbuild-cmake --json assets --jq '.assets[].name'
          $name = $assets | Where-Object { $_ -match '^mpv-dev-${{ matrix.mpv }}-\d+-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          if (-not $name) { throw "Archive libmpv ${{ matrix.mpv }} introuvable" }
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern $name --dir mpv
          7z x "mpv/$name" -ompv/extract -y | Out-Null
          Copy-Item mpv/extract/libmpv-2.dll target/${{ matrix.target }}/release/

      - name: Archive
        id: package
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $zip = "IPTV-Player-$version-windows-${{ matrix.arch }}.zip"
          $out = "target/package"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/${{ matrix.target }}/release/iptv-player.exe, target/${{ matrix.target }}/release/libmpv-2.dll $out
          Compress-Archive -Path "$out/*" -DestinationPath $zip -Force
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v5
        with:
          name: IPTV-Player-windows-${{ matrix.arch }}
          path: desktop/${{ steps.package.outputs.zip }}
          if-no-files-found: error

  publish:
    name: Publier la release Windows
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: IPTV-Player-windows-*
          path: release
          merge-multiple: true

      - name: Créer la release et y joindre les archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#windows-v}"
          CARGO_VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' desktop/Cargo.toml | head -n1)
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $TAG mais version $CARGO_VERSION dans desktop/Cargo.toml"
            exit 1
          fi
          # Notes : desktop/release-notes/<version>.md (1re ligne « # Titre », puis le texte
          # affiché dans la release et dans la fenêtre de mise à jour).
          NOTES="desktop/release-notes/${VERSION}.md"
          if [ -f "$NOTES" ]; then
            TITLE="IPTV Player Windows ${VERSION} – $(head -n1 "$NOTES" | sed 's/^# *//')"
            tail -n +2 "$NOTES" > body.md
          else
            TITLE="IPTV Player Windows ${VERSION}"
            echo "Corrections et améliorations." > body.md
          fi
          {
            echo
            echo "Téléchargez **IPTV-Player-${VERSION}-windows-x64.zip** (PC Intel/AMD) ou **-arm64.zip** (PC Snapdragon), ou acceptez la mise à jour proposée dans l'application."
          } >> body.md
          # --latest=false : la « dernière release » reste celle d'Android (mise à jour de l'APK).
          gh release create "$TAG" release/*.zip --title "$TITLE" --notes-file body.md --latest=false
