[package]
name = "iptv-player"
version = "1.5.0"
edition = "2024"
description = "Lecteur IPTV Xtream Codes pour Windows (PC et PC tactile)"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit", "default_fonts", "clipboard", "links"] }
egui = "0.37"
egui_glow = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "gzip", "stream"] }
native-tls = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
percent-encoding = "2"
libloading = "0.9"
rfd = "0.17"
mdns-sd = "0.17"
zip = { version = "6", default-features = false, features = ["deflate"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
